plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.app.rwd"
    compileSdk = 36
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    ndkVersion "26.1.10909125"   // ✅ 16 KB page compatible

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.app.rwd"
        minSdk = 24
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    /*signingConfigs {
        release {
            // Use assignment, not a method call
            storeFile = file("../../ridewithdriver-release-key.keystore")
            storePassword = "ridewithdriver"
            keyAlias = "ridewithdriver-key-alias"
            keyPassword = "ridewithdriver"
        }
    }*/

    buildTypes {
        release {
            signingConfig signingConfigs.debug

            minifyEnabled true          // ✅ ENABLE
            shrinkResources true        // ✅ ENABLE

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    configurations.configureEach {
        exclude group: 'com.google.firebase', module: 'firebase-iid'
    }

}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
  //  implementation 'com.google.android.play:core:2.3.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"

    implementation platform('com.google.firebase:firebase-bom:33.5.1')

    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
}
